<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DMARC reports</title>
<link rel="stylesheet" href="/dmarc/dmarc.css" />
<script type="module" src="/dmarc/js/app.js"></script>
</head>
<body>

<header class="masthead">
 <h1>Mail<span class="colons">::</span>DMARC</h1>

 <div class="scope">
  <div class="field">
   <label class="field-label" for="scope-domain">Domain</label>
   <span id="scope-domain-mount"></span>
  </div>
  <label class="field">
   <span class="field-label">Window</span>
   <select id="scope-window"></select>
  </label>
 </div>

 <nav class="views" id="views">
  <a href="#/overview">Overview</a>
  <a href="#/sources">Sources</a>
  <a href="#/reports">Reports</a>
 </nav>

 <button type="button" id="theme" class="theme" aria-label="Switch between light and dark"></button>
</header>

<main id="view" aria-live="polite"></main>

<footer class="footer">
 <p>
  Served by <a href="https://metacpan.org/dist/Mail-DMARC">Mail::DMARC</a>.
  Volumes are message counts as reported by receivers, not messages observed locally.
 </p>
</footer>

</body>
</html>
