<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8" />
 <title>Mail::DMARC</title>
 <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/2.3.7/css/dataTables.dataTables.min.css" />
 <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 <script type="text/javascript" src="https://cdn.datatables.net/2.3.7/js/dataTables.min.js"></script>

<style type="text/css">
html, body {
  margin: 0;
  padding: 0;
  font-size: 80%;
  font-family: sans-serif;
}
td.dt-control {
  cursor: pointer;
}
td.dt-control::before {
  content: '\25B6';
  color: #888;
}
tr.shown td.dt-control::before {
  content: '\25BC';
}
.dmarc-pass, .dmarc-none       { background-color: #CCFFCC; }
.dmarc-fail, .dmarc-reject     { background-color: #FFCCCC; }
.dmarc-quarantine              { background-color: #FFFFCC; }
span.dmarc-cell {
  display: block;
  padding: 2px 4px;
}
table.child-detail {
  width: 100%;
  border-collapse: collapse;
  margin: 4px 0;
}
table.child-detail th, table.child-detail td {
  border: 1px solid #ccc;
  padding: 4px 6px;
}
.child-loading { padding: 4px; }
span.ptr-host {
  display: block;
  color: #666;
  word-break: break-all;
}
p.ptr-controls {
  margin: 6px 8px;
}
p.ptr-controls label { margin-right: 1em; }
p.ptr-controls select,
p.ptr-controls input[type="text"] {
  padding: 2px 4px;
  font-size: 100%;
}
p.ptr-controls input[type="text"] { width: 24em; }
span.doh-status { margin: 0 0.5em; }
span.doh-status.ok  { color: #2a7; }
span.doh-status.bad { color: #c33; }
span.ptr-note { color: #666; }
thead input {
  width: 100%;
  box-sizing: border-box;
  padding: 2px 4px;
  font-size: 100%;
}
</style>

<script type="text/javascript">
const dmarcCell = (value) => {
  if (!value) return '';
  return `<span class="dmarc-cell dmarc-${value.toLowerCase()}">${value}</span>`;
};

const escAttr = (s) => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

// Reverse DNS is resolved in the browser, not by dmarc_httpd: the report rows
// are full of IPs with no PTR record, and blocking the server on those lookups
// would stall it for every viewer. It is off by default because it hands the
// source IPs of your reports to a third party resolver.
const DOH_PRESETS = [
  { label: 'Cloudflare', url: 'https://cloudflare-dns.com/dns-query' },
  { label: 'Google',     url: 'https://dns.google/resolve' },
];
const DEFAULT_DOH_URL = DOH_PRESETS[0].url;
const PTR_TIMEOUT_MS  = 3000;
const PTR_CONCURRENCY = 5;
const PTR_ENABLED_KEY = 'dmarc.ptr.enabled';
const DOH_URL_KEY     = 'dmarc.ptr.doh_url';

let ptrEnabled = false;
let dohUrl     = DEFAULT_DOH_URL;

const storeGet = (key) => {
  try { return localStorage.getItem(key); } catch { return null; }
};
const storeSet = (key, value) => {
  try { localStorage.setItem(key, value); } catch { /* private browsing */ }
};

const expandIPv6 = (ip) => {
  if (!ip.includes(':') || !/^[0-9A-Fa-f:.]+$/.test(ip)) return null;

  let rest = ip;
  const v4 = rest.match(/(\d{1,3}(?:\.\d{1,3}){3})$/);
  if (v4) {
    const octets = v4[1].split('.').map(Number);
    if (octets.some(o => o > 255)) return null;
    rest = rest.slice(0, v4.index)
         + ((octets[0] << 8) | octets[1]).toString(16) + ':'
         + ((octets[2] << 8) | octets[3]).toString(16);
  }

  const halves = rest.split('::');
  if (halves.length > 2) return null;
  const head = halves[0] ? halves[0].split(':') : [];
  const tail = halves.length === 2 && halves[1] ? halves[1].split(':') : [];
  const fill = halves.length === 2 ? 8 - head.length - tail.length : 0;
  if (fill < 0) return null;

  const groups = [...head, ...Array(fill).fill('0'), ...tail];
  if (groups.length !== 8) return null;

  let nibbles = '';
  for (const g of groups) {
    if (!/^[0-9A-Fa-f]{1,4}$/.test(g)) return null;
    nibbles += g.toLowerCase().padStart(4, '0');
  }
  return nibbles;
};

const reverseName = (ip) => {
  if (/^\d{1,3}(?:\.\d{1,3}){3}$/.test(ip)) {
    if (ip.split('.').some(o => Number(o) > 255)) return null;
    return ip.split('.').reverse().join('.') + '.in-addr.arpa';
  }
  const nibbles = expandIPv6(ip);
  return nibbles ? nibbles.split('').reverse().join('.') + '.ip6.arpa' : null;
};

const dohQuery = (base, name) => {
  let url;
  try { url = new URL(base); }
  catch { return null; }
  if (!/^https?:$/.test(url.protocol)) return null;
  url.searchParams.set('name', name);
  url.searchParams.set('type', 'PTR');
  return url.href;
};

const ptrCache  = new Map();
const ptrQueue  = [];
let   ptrActive = 0;

// Answers in flight when the resolver changes belong to the old resolver.
let ptrGeneration = 0;

const pumpPtrQueue = () => {
  while (ptrActive < PTR_CONCURRENCY && ptrQueue.length) {
    ptrActive++;
    ptrQueue.shift()().then(() => {
      ptrActive--;
      pumpPtrQueue();
    });
  }
};

const lookupPtr = (ip) => {
  if (!ptrEnabled) return Promise.resolve('');
  if (ptrCache.has(ip)) return ptrCache.get(ip);

  const name       = reverseName(ip);
  const query      = name && dohQuery(dohUrl, name);
  const generation = ptrGeneration;
  const result = !query ? Promise.resolve('') : new Promise(resolve => {
    ptrQueue.push(() => {
      // The queue outlives an opt-out or a resolver change, and a job dequeued
      // afterwards would disclose a source IP the user just withdrew.
      if (!ptrEnabled || generation !== ptrGeneration) {
        ptrCache.delete(ip);    // let a later opt-in ask again
        resolve('');
        return Promise.resolve();
      }

      const ctl   = new AbortController();
      const timer = setTimeout(() => ctl.abort(), PTR_TIMEOUT_MS);
      return fetch(query, {
          headers: { accept: 'application/dns-json' },
          signal:  ctl.signal,
        })
        .then(r => r.ok ? r.json() : null)
        .then(json => {
          const answer = (json?.Answer || []).find(a => a.type === 12);
          resolve(answer ? String(answer.data).replace(/\.$/, '') : '');
        })
        .catch(() => resolve(''))
        .finally(() => clearTimeout(timer));
    });
    pumpPtrQueue();
  });

  ptrCache.set(ip, result);
  return result;
};

// PTR records are controlled by the operator of the sending IP, so the answer
// is set as text, never parsed as HTML.
const showHostnames = (container) => {
  if (!ptrEnabled) return;
  const generation = ptrGeneration;
  jQuery(container).find('span.ptr-host[data-ip]').each(function() {
    const el = this;
    lookupPtr(el.getAttribute('data-ip')).then(host => {
      if (host && ptrEnabled && generation === ptrGeneration) el.textContent = host;
    });
  });
};

const clearHostnames = () => {
  ptrGeneration++;
  jQuery('span.ptr-host').text('');
};

const setPtrEnabled = (enabled) => {
  ptrEnabled = enabled;
  storeSet(PTR_ENABLED_KEY, enabled ? '1' : '');
  clearHostnames();
  showHostnames(document);
};

// The probe asks for a fixed public name, so typing a resolver never discloses
// a source IP to it. It doubles as the CORS check: a resolver that answers
// JSON but omits the CORS headers fails here exactly as it would in use.
const PROBE_NAME = '8.8.8.8.in-addr.arpa';

let probeCtl;

const cancelProbe = () => {
  probeCtl?.abort();
  probeCtl = null;
};

const probeResolver = (url) => {
  const query = dohQuery(url, PROBE_NAME);
  if (!query) return Promise.reject(new Error('enter an http(s) URL'));

  cancelProbe();
  probeCtl = new AbortController();
  const ctl   = probeCtl;
  const timer = setTimeout(() => { ctl.timedOut = true; ctl.abort(); }, PTR_TIMEOUT_MS);
  return fetch(query, {
      headers: { accept: 'application/dns-json' },
      signal:  ctl.signal,
    })
    .then(r => r.ok ? r.json().catch(() => null) : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(json => {
      if (!json || typeof json.Status !== 'number') throw new Error('not a JSON DoH resolver');
      if (json.Status !== 0) throw new Error(`resolver returned status ${json.Status}`);
      return true;
    })
    // an abort means the timeout fired; a newer keystroke's abort is left alone
    .catch(err => { throw ctl.timedOut ? new Error('timed out') : err; })
    .finally(() => clearTimeout(timer));
};

const setDohUrl = (url) => {
  if ((url || DEFAULT_DOH_URL) === dohUrl) return dohUrl;
  dohUrl = url || DEFAULT_DOH_URL;
  storeSet(DOH_URL_KEY, dohUrl);
  ptrCache.clear();
  clearHostnames();
  showHostnames(document);
  return dohUrl;
};

const formatChildRows = (rows) => {
  if (!rows || !rows.length) return '<p>No detail rows found.</p>';
  const body = rows.map(r => `<tr>
    <td>${r.header_from   || ''}</td>
    <td>${r.source_ip     || ''}${r.source_ip ? `<span class="ptr-host" data-ip="${escAttr(r.source_ip)}"></span>` : ''}</td>
    <td>${r.count         || ''}</td>
    <td>${dmarcCell(r.disposition)}</td>
    <td>${dmarcCell(r.spf)}</td>
    <td>${dmarcCell(r.dkim)}</td>
    <td>${r.envelope_to   || ''}</td>
    <td>${r.envelope_from || ''}</td>
  </tr>`).join('');
  return `<table class="child-detail"><thead><tr>
    <th>Header From</th><th>IP</th><th>#</th><th>Disposition</th>
    <th>SPF</th><th>DKIM</th><th>Envelope To</th><th>Envelope From</th>
  </tr></thead><tbody>${body}</tbody></table>`;
};

jQuery(document).ready(() => {
  let filterDomain = '';
  let filterAuthor = '';

  ptrEnabled = storeGet(PTR_ENABLED_KEY) === '1';
  dohUrl     = storeGet(DOH_URL_KEY) || DEFAULT_DOH_URL;

  jQuery('#ptr-enable')
    .prop('checked', ptrEnabled)
    .on('change', function() { setPtrEnabled(this.checked); });

  const preset = jQuery('#doh-preset');
  const custom = jQuery('#doh-url');
  DOH_PRESETS.forEach(p => preset.append(jQuery('<option>').val(p.url).text(p.label)));
  preset.append(jQuery('<option>').val('').text('Other\u2026'));

  const presetMatch = DOH_PRESETS.some(p => p.url === dohUrl);
  preset.val(presetMatch ? dohUrl : '');
  custom.val(dohUrl).prop('hidden', presetMatch);

  const status = jQuery('#doh-status');
  const setStatus = (state, text) => status.attr('class', `doh-status ${state}`).text(text);

  const checkCustom = () => {
    const value = custom.val().trim();
    setStatus('', 'checking\u2026');
    probeResolver(value)
      .then(() => {
        setStatus('ok', '\u2713 responding');
        setDohUrl(value);
      })
      .catch(err => {
        if (err.name === 'AbortError') return;
        setStatus('bad', `\u2717 ${err.message === 'Failed to fetch' ? 'unreachable, or no CORS headers' : err.message}`);
      });
  };

  let checkTimer;
  preset.on('change', function() {
    clearTimeout(checkTimer);
    cancelProbe();
    setStatus('', '');
    if (this.value) {
      custom.prop('hidden', true).val(setDohUrl(this.value));
      return;
    }
    custom.prop('hidden', false).trigger('focus');
    checkCustom();
  });

  custom.on('input', () => {
    clearTimeout(checkTimer);
    checkTimer = setTimeout(checkCustom, 500);
  });
  custom.on('change', () => {
    clearTimeout(checkTimer);
    checkCustom();
  });

  if (!presetMatch) checkCustom();

  const table = jQuery('#grid').DataTable({
    processing: true,
    serverSide: true,
    rowId: 'rid',
    ajax: (data, callback) => {
      const orderCol = data.order?.[0];
      const sortCol  = orderCol ? (data.columns[orderCol.column].name || 'r.id') : 'r.id';
      const sortDir  = orderCol?.dir || 'desc';
      const params   = {
        start:    data.start,
        length:   data.length,
        sort_col: sortCol,
        sort_dir: sortDir,
      };
      if (filterDomain) params.search_domain = filterDomain;
      if (filterAuthor) params.search_author = filterAuthor;
      fetch('/dmarc/json/report?' + new URLSearchParams(params))
        .then(r => r.json())
        .then(json => callback({
          draw:            data.draw,
          recordsTotal:    json.recordsTotal,
          recordsFiltered: json.recordsFiltered || json.recordsTotal,
          data:            json.data || [],
        }))
        .catch(() => callback({
          draw:            data.draw,
          recordsTotal:    0,
          recordsFiltered: 0,
          data:            [],
        }));
    },
    columns: [
      { data: 'rid',         name: null,        title: '',             className: 'dt-control', orderable: false,
        render: () => '' },
      { data: 'rid',         name: 'r.id',      title: 'Id',
        render: (data, type, row) => type === 'display' ? `<span title="${escAttr(row.uuid)}">${data}</span>` : data },
      { data: 'from_domain', name: 'fd.domain', title: 'Sender/From' },
      { data: 'author',      name: 'a.org_name', title: 'Org Name' },
      { data: 'begin',       name: 'r.begin',   title: 'Begin' },
      { data: 'end',         name: 'r.end',     title: 'End' },
    ],
    order: [[1, 'desc']],
    pageLength: 100,
    lengthMenu: [50, 100, 500],
    searching: false,
    initComplete: function() {
      const api = this.api();
      const searchTr = jQuery('<tr>');
      api.columns().every(function(i) {
        const th = jQuery('<th>');
        if (i === 2 || i === 3) {
          const placeholder = i === 2 ? 'Filter sender\u2026' : 'Filter org\u2026';
          let timer;
          jQuery('<input type="text" />')
            .attr('placeholder', placeholder)
            .on('input', function() {
              clearTimeout(timer);
              const val = this.value;
              timer = setTimeout(() => {
                if (i === 2) filterDomain = val;
                else filterAuthor = val;
                api.draw();
              }, 300);
            })
            .appendTo(th);
        }
        searchTr.append(th);
      });
      jQuery('#grid thead').append(searchTr);
    },
  });

  jQuery('#grid tbody').on('click', 'td.dt-control', function() {
    const tr  = jQuery(this).closest('tr');
    const rid = tr[0].id;
    if (!rid) return;
    const row = table.row(tr);
    if (row.child.isShown()) {
      row.child.hide();
      tr.removeClass('shown');
      return;
    }
    row.child('<p class="child-loading">Loading\u2026</p>').show();
    tr.addClass('shown');
    fetch(`/dmarc/json/row?rid=${rid}`)
      .then(r => {
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        return r.json();
      })
      .then(json => {
        const detail = jQuery(formatChildRows(json.data));
        table.row(tr[0]).child(detail).show();
        showHostnames(detail);
      })
      .catch(() => {
        table.row(tr[0]).child.hide();
        tr.removeClass('shown');
      });
  });
});
</script>

</head>
<body>

<p class="ptr-controls">
 <label><input type="checkbox" id="ptr-enable" /> Show reverse DNS hostnames</label>
 <label>resolver <select id="doh-preset"></select></label>
 <input type="text" id="doh-url" spellcheck="false" hidden
        aria-label="Custom DNS-over-HTTPS resolver URL" /><span id="doh-status" class="doh-status" role="status"></span>
 <span class="ptr-note">source IPs are sent to this DNS-over-HTTPS resolver</span>
</p>

<table id="grid" class="display" style="width:100%"><caption>DMARC Reports</caption></table>
<p>by <a href="https://metacpan.org/dist/Mail-DMARC">Mail::DMARC</a>.</p>

</body>
</html>
